<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TYPE RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#17324d;background:linear-gradient(135deg,#eef8ff,#fffdf0 55%,#f1f0ff);min-height:100vh}
.wrap{width:min(1000px,94vw);margin:auto;padding:25px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:clamp(30px,6vw,50px);font-weight:950;letter-spacing:.06em;color:#2777e8}.logo small{display:block;font-size:11px;letter-spacing:.2em;color:#7890a6;margin-top:-7px}.pill{background:#fff;border:1px solid #dbe8f4;border-radius:99px;padding:9px 14px;font-weight:800;color:#2777e8}
.card{background:#fffdfd;border:1px solid #dbe8f4;border-radius:25px;padding:22px;box-shadow:0 15px 45px rgba(54,100,150,.13)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}label{display:block;font-size:12px;font-weight:900;color:#70879d;margin:0 0 7px 3px}
select,button{width:100%;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:850;border:1px solid #d5e5f2;background:#fff;color:#17324d}select:focus{outline:3px solid #e1f1ff}
button{border:0;color:white;background:linear-gradient(135deg,#2879e8,#58a8ff);box-shadow:0 8px 18px #2879e82e;cursor:pointer}button:disabled{opacity:.6;cursor:default}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat{background:#f6fbff;border:1px solid #dfedf7;border-radius:17px;text-align:center;padding:12px}.stat b{display:block;color:#2677e8;font-size:23px}.stat span{font-size:11px;color:#7890a6;font-weight:800}.timer{color:#e35e69!important}
.game{text-align:center;margin-top:8px}.cat{display:inline-block;background:#e8f6ff;color:#2677e8;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:900}.prompt{min-height:100px;display:flex;justify-content:center;align-items:center;padding:12px;font-size:clamp(28px,5vw,46px);line-height:1.45;font-weight:900;word-break:break-all}.hint{font-size:13px;color:#7890a6;margin-bottom:12px}
input{width:100%;padding:15px 18px;border:3px solid #b8dcff;border-radius:18px;background:#fbfeff;text-align:center;font-size:clamp(21px,4vw,31px);font-weight:850;color:#17324d;outline:none}input:focus{border-color:#2879e8;box-shadow:0 0 0 5px #e3f2ff}
.live{min-height:40px;margin-top:9px;font-size:18px;font-weight:850;word-break:break-all}.ok{color:#277be8}.now{color:#e1aa00;text-decoration:underline;text-decoration-thickness:3px}.bad{color:#e45e69}
.msg{min-height:25px;margin-top:7px;color:#7890a6;font-size:13px;font-weight:800}.bar{height:9px;background:#eaf2f8;border-radius:99px;overflow:hidden;margin-top:15px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38c8d7,#2879e8)}
.note{text-align:center;color:#8aa0b4;font-size:11px;margin-top:13px}
@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.controls>div:last-child{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}.stats .stat:nth-child(n+4){display:none}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">TYPE RUSH<small>JUNIOR TYPING CHALLENGE</small></div><div class="pill">明るく楽しくタイピング</div></div>
<div class="card">
<div class="controls">
<div><label>時間</label><select id="duration"><option value="30">30秒</option><option value="60">1分</option><option value="90">1分30秒</option><option value="120">2分</option></select></div>
<div><label>ゲームモード</label><select id="mode"><option value="normal">普通</option><option value="accuracy">正確重視</option><option value="speed">スピード重視</option></select></div>
<div><label>&nbsp;</label><button id="start">ゲーム開始</button></div>
</div>
<div class="stats">
<div class="stat"><b id="time" class="timer">30</b><span>残り時間（秒）</span></div>
<div class="stat"><b id="score">0</b><span>スコア</span></div>
<div class="stat"><b id="acc">100%</b><span>正確率</span></div>
<div class="stat"><b id="wpm">0</b><span>WPM</span></div>
<div class="stat"><b id="correct">0</b><span>正解数</span></div>
</div>
<div class="game">
<div id="cat" class="cat">準備OK</div>
<div id="prompt" class="prompt">ゲーム開始を押してください</div>
<div class="hint">表示された文章を、そのまま入力してください</div>
<input id="input" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<div id="live" class="live"></div>
<div id="msg" class="msg"></div>
<div class="bar"><i id="bar"></i></div>
</div>
<div class="note">正解したら演出や待ち時間なしで、すぐ次の文章に進みます。</div>
</div>
</div>

<script>
const Q=[
["理科","光合成"],["理科","地球は太陽の周りを公転する"],["理科","水は摂氏百度で沸騰する"],["理科","電流の単位はアンペアである"],["理科","植物は二酸化炭素を取り入れる"],
["数学","三角形の内角の和は百八十度"],["数学","円周率は約三点一四である"],["数学","一次方程式を使って未知の数を求める"],["数学","比例では二つの量の関係が一定である"],
["社会","日本の首都は東京"],["社会","江戸幕府を開いたのは徳川家康"],["社会","日本国憲法は基本的人権を保障している"],["社会","鎌倉幕府は源頼朝によって開かれた"],
["英語","重要"],["英語","環境"],["英語","コミュニケーション"],["英語","自分自身に挑戦する"],["英語","将来の夢について話す"],
["情報","情報を安全に扱うにはパスワード管理が重要"],["情報","プログラムは命令を順番に実行する"],["情報","個人情報をむやみに公開してはいけない"],
["言葉","継続は力なり"],["言葉","失敗は成功のもと"],["言葉","新しいことに挑戦する"],["言葉","相手の立場を考えて行動する"]
];
const $=id=>document.getElementById(id);
let running=false,end=0,startAt=0,timer=null,idx=0,current=null,correct=0,typed=0,errors=0;
let duration=30,mode="normal",composing=false,audio=null;

function norm(s){return s.normalize("NFKC").replace(/\s+/g,"")}
function esc(s){return s.replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function sound(freq=880){
 try{audio ||= new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended")audio.resume();
 let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.connect(g);g.connect(audio.destination);o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.07,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.11);o.start(n);o.stop(n+.13)}catch(e){}
}
function score(){
 let base=correct*100+Math.max(0,typed-errors)*2;
 if(mode==="accuracy")return Math.max(0,Math.round(base-errors*6+Math.max(0,typed-errors)));
 if(mode==="speed")return Math.round(base+correct*45+Math.max(0,typed-errors));
 return Math.round(base);
}
function stats(){
 let left=Math.max(0,(end-Date.now())/1000),minutes=Math.max((Date.now()-startAt)/60000,.001),right=Math.max(0,typed-errors);
 $("time").textContent=Math.ceil(left);$("score").textContent=score();$("correct").textContent=correct;
 $("acc").textContent=(typed?Math.max(0,right/typed*100):100).toFixed(0)+"%";
 $("wpm").textContent=Math.round((right/5)/minutes);
 $("bar").style.width=Math.max(0,left/duration*100)+"%";
}
function next(){
 current=Q[idx++%Q.length];$("cat").textContent=current[0];$("prompt").textContent=current[1];
 $("input").value="";$("live").innerHTML="";$("msg").textContent="";
}
function live(){
 let t=norm(current[1]),v=norm($("input").value),h="";
 for(let i=0;i<v.length;i++)h+=`<span class="${v[i]===t[i]?"ok":"bad"}">${esc(v[i])}</span>`;
 if(v.length<t.length)h+=`<span class="now">${esc(t[v.length])}</span>`;
 $("live").innerHTML=h;
}
function process(){
 if(!running)return;
 let raw=$("input").value,clean=raw.replace(/[^ぁ-ゖ一-龯々〆ヵヶー]/g,"");
 if(clean!==raw)$("input").value=clean;
 let t=norm(current[1]),v=norm(clean),old=typed;
 if(v.length>old){for(let i=old;i<v.length;i++)if(v[i]!==t[i])errors++;typed=Math.max(typed,v.length)}
 live();
 if(v===t){correct++;sound(880);next()}
 stats();
}
function start(){
 duration=+$("duration").value;mode=$("mode").value;running=true;idx=0;correct=0;typed=0;errors=0;
 startAt=Date.now();end=startAt+duration*1000;$("input").disabled=false;$("start").disabled=true;$("start").textContent="ゲーム中…";
 next();$("input").focus();sound(660);stats();clearInterval(timer);
 timer=setInterval(()=>{stats();if(Date.now()>=end)finish()},100);
}
function finish(){
 if(!running)return;running=false;clearInterval(timer);$("input").disabled=true;$("start").disabled=false;$("start").textContent="もう一度プレイ";
 $("msg").textContent=`終了！ スコア ${score()}　正解 ${correct}問　正確率 ${$("acc").textContent}`;sound(330);stats();
}
$("start").onclick=start;
$("input").addEventListener("compositionstart",()=>composing=true);
$("input").addEventListener("compositionend",()=>{composing=false;process()});
$("input").addEventListener("input",()=>{if(running&&!composing)process();else if(running)live()});
$("duration").onchange=()=>{if(!running)$("time").textContent=$("duration").value};
</script>
</body>
</html>
